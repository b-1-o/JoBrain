name: Prisma migration diff

on:
  push:
    branches: ["ai/followup-hardening"]

jobs:
  diff:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d jobrain"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobrain
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobrain_shadow
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Create shadow database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d jobrain -c "CREATE DATABASE jobrain_shadow;"
      - name: Generate migration diff
        run: |
          mkdir -p migration-diff
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --script > migration-diff/migration.sql
      - name: Upload migration diff
        uses: actions/upload-artifact@v4
        with:
          name: prisma-migration-diff
          path: migration-diff/migration.sql
