name: E2E

on:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d jobrain"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jobrain
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/jobrain
      JOBRAIN_USER_AGENT: JoBrain-E2E
      JOBRAIN_E2E_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Prepare database
        run: npx prisma migrate deploy
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run e2e
