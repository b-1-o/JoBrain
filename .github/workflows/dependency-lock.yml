name: Dependency lock generation

permissions:
  contents: write

on:
  push:
    branches:
      - ai/followup-hardening
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip generated commits
        id: guard
        run: |
          if git log -1 --format=%s | grep -q '^chore: sync production tooling lockfile$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate package metadata
        if: steps.guard.outputs.skip != 'true'
        run: |
          npm install @sentry/nextjs@latest --save
          npm install --save-dev msw@latest @playwright/test@latest storybook@latest @storybook/nextjs@latest

      - name: Commit generated package metadata through GitHub API
        if: steps.guard.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            for (const path of ["package.json", "package-lock.json"]) {
              const content = fs.readFileSync(path, "utf8");
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: process.env.TARGET_BRANCH,
              });
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                branch: process.env.TARGET_BRANCH,
                message: "chore: sync production tooling lockfile",
                content: Buffer.from(content, "utf8").toString("base64"),
                sha: existing.data.sha,
              });
            }
