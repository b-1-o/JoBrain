name: Bootstrap production tooling

on:
  push:
    branches: ["ai/followup-hardening"]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, 'chore: bootstrap production tooling') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install production observability
        run: npm install @sentry/nextjs@latest --save

      - name: Install test and Storybook tooling
        run: npm install --save-dev msw@latest @playwright/test@latest storybook@latest @storybook/nextjs@latest

      - name: Commit lockfile and package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: bootstrap production tooling"
          git push
