name: Reminder worker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run reminder worker
        env:
          JOBRAIN_CRON_URL: ${{ secrets.JOBRAIN_CRON_URL }}
          JOBRAIN_CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$JOBRAIN_CRON_URL"
          test -n "$JOBRAIN_CRON_SECRET"
          curl --fail --silent --show-error --max-time 60             -H "x-jobrain-cron-secret: $JOBRAIN_CRON_SECRET"             "$JOBRAIN_CRON_URL/api/cron/reminders"
