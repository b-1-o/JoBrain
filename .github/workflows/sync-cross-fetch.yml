name: Sync test polyfill lockfile

permissions:
  contents: write

on:
  push:
    branches: ["ai/followup-hardening"]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Skip generated commit
        id: guard
        run: |
          if git log -1 --format=%s | grep -q '^chore: sync cross-fetch lockfile$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate lockfile
        if: steps.guard.outputs.skip != 'true'
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit through GitHub API
        if: steps.guard.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const path = "package-lock.json";
            const content = fs.readFileSync(path, "utf8");
            const existing = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: process.env.TARGET_BRANCH,
            });
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: process.env.TARGET_BRANCH,
              message: "chore: sync cross-fetch lockfile",
              content: Buffer.from(content, "utf8").toString("base64"),
              sha: existing.data.sha,
            });
